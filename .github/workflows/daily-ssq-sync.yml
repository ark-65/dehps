name: Daily SSQ Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * 0,2,4"

jobs:
  daily-ssq-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dehps
          POSTGRES_USER: dehps
          POSTGRES_PASSWORD: dehps_password
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dehps -d dehps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker
        working-directory: apps/worker-python
        run: pip install -e .
      - name: Init database
        run: psql postgresql://dehps:dehps_password@localhost:54329/dehps -f infra/postgres/init/001_init.sql
      - name: Run pipeline
        working-directory: apps/worker-python
        run: python scripts/daily_pipeline.py --strategy-key baseline_v1
      - name: Commit reports
        working-directory: apps/worker-python
        run: python scripts/git_commit_and_push.py --message "chore(data): daily ssq sync" --push

