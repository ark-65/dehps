name: Worker Python Tests

on:
  pull_request:
    paths:
      - "apps/worker-python/**"
      - ".github/workflows/worker-python-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/worker-python/**"
      - ".github/workflows/worker-python-tests.yml"

concurrency:
  group: worker-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Frozen evidence digests include numerically solved float payloads.
      # Keep OpenBLAS on one portable AVX2 kernel so hosted-runner CPU model
      # changes cannot perturb the final few bits and make replay checks flaky.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: apps/worker-python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker-python/pyproject.toml
      - name: Install worker
        run: python -m pip install -e .
      - name: Run worker test suite
        # Initialize OpenBLAS on one portable kernel, then remove the selector
        # before pytest so canonical executor-environment checks remain exact.
        run: >-
          OPENBLAS_CORETYPE=Haswell python -c
          'import os, numpy, pytest;
          os.environ.pop("OPENBLAS_CORETYPE", None);
          raise SystemExit(pytest.main(["-q"]))'
