name: Worker Python Tests

on:
  pull_request:
    paths:
      - "apps/worker-python/**"
      - "apps/api/**"
      - "deploy/execution/**"
      - ".github/workflows/worker-python-tests.yml"
      - ".github/scripts/run_worker_tests.py"
      - "docs/experiments/2026-08-11-m4-p3-predictive-route-reconciliation-and-p2r-p6-policy.md"
  push:
    branches: [main]
    paths:
      - "apps/worker-python/**"
      - "apps/api/**"
      - "deploy/execution/**"
      - ".github/workflows/worker-python-tests.yml"
      - ".github/scripts/run_worker_tests.py"
      - "docs/experiments/2026-08-11-m4-p3-predictive-route-reconciliation-and-p2r-p6-policy.md"

concurrency:
  group: worker-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEHPS_CI_SHARD_INDEX: ${{ matrix.shard }}
      # Frozen evidence digests include numerically solved float payloads.
      # Keep OpenBLAS on one portable AVX2 kernel so hosted-runner CPU model
      # changes cannot perturb the final few bits and make replay checks flaky.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: apps/worker-python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: apps/worker-python/pyproject.toml
      - name: Install worker
        run: python -m pip install -e . "numpy==2.4.6"
      - name: Run complete worker test partition
        run: OPENBLAS_CORETYPE=Haswell python ../../.github/scripts/run_worker_tests.py

  execution-isolation:
    name: Execution PostgreSQL isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dehps_execution_test_admin
          POSTGRES_USER: execution_test_admin
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --label dehps.execution-test=true
          --health-cmd "pg_isready -U execution_test_admin -d dehps_execution_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEHPS_EXECUTION_TEST_ADMIN_DSN: "host=127.0.0.1 port=5432 dbname=dehps_execution_test_admin user=execution_test_admin password=disposable-ci-only"
    defaults:
      run:
        working-directory: apps/worker-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Install worker and boundary test dependencies
        run: python -m pip install -e . "numpy==2.4.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: Install and verify status API
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Require real database role isolation
        env:
          DEHPS_EXECUTION_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest -q tests/test_execution_context.py tests/test_execution_artifacts.py integration_tests/test_execution_database_isolation.py integration_tests/test_execution_authority.py integration_tests/test_execution_store.py integration_tests/test_execution_mainline.py integration_tests/test_execution_status_api.py integration_tests/test_observation_execution.py integration_tests/test_learning_execution.py integration_tests/test_control_database_install.py
      - name: Resolve isolated process test image
        run: |
          docker pull python:3.12-slim
          echo "DEHPS_EXECUTION_OS_IMAGE=$(docker image inspect python:3.12-slim --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Require kernel-enforced file isolation
        run: python -m pytest -q integration_tests/test_execution_os_isolation.py
      - name: Require fixed release and offline rollback
        run: python -m pytest -q tests/test_execution_release_schema.py integration_tests/test_execution_release.py
      - name: Resolve observation release base
        run: |
          docker pull python:3.14.4-slim
          echo "DEHPS_OBSERVATION_TEST_BASE_IMAGE=$(docker image inspect python:3.14.4-slim --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Require installed observation release and real downstream consumption
        env:
          DEHPS_EXECUTION_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest -q -s integration_tests/test_observation_release.py
      - name: Require installed learning release and preserved evidence
        env:
          DEHPS_EXECUTION_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest -q -s integration_tests/test_learning_release.py integration_tests/test_learning_socket_release.py

  pytest:
    name: pytest
    if: always()
    needs: [worker, execution-isolation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every partition to succeed
        env:
          WORKER_RESULT: ${{ needs.worker.result }}
          ISOLATION_RESULT: ${{ needs.execution-isolation.result }}
        run: |
          test "$WORKER_RESULT" = success
          test "$ISOLATION_RESULT" = success
