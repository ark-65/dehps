name: Worker Python Tests

on:
  pull_request:
    paths:
      - "apps/worker-python/**"
      - ".github/workflows/worker-python-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/worker-python/**"
      - ".github/workflows/worker-python-tests.yml"

concurrency:
  group: worker-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/worker-python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker-python/pyproject.toml
      - name: Install worker
        run: python -m pip install -e .
      - name: Run worker test suite
        run: python -m pytest -q
