name: Worker Python Tests

on:
  pull_request:
    paths:
      - "apps/worker-python/**"
      - ".github/workflows/worker-python-tests.yml"
      - "docs/experiments/2026-08-11-m4-p3-predictive-route-reconciliation-and-p2r-p6-policy.md"
  push:
    branches: [main]
    paths:
      - "apps/worker-python/**"
      - ".github/workflows/worker-python-tests.yml"
      - "docs/experiments/2026-08-11-m4-p3-predictive-route-reconciliation-and-p2r-p6-policy.md"

concurrency:
  group: worker-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Frozen evidence digests include numerically solved float payloads.
      # Keep OpenBLAS on one portable AVX2 kernel so hosted-runner CPU model
      # changes cannot perturb the final few bits and make replay checks flaky.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: apps/worker-python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: apps/worker-python/pyproject.toml
      - name: Install worker
        run: python -m pip install -e . "numpy==2.4.6"
      - name: Run worker test suite
        # Initialize OpenBLAS on one portable kernel, then remove the selector
        # before pytest so canonical executor-environment checks remain exact.
        # Six completed-lineage replay/equivalence nodes are retained in source
        # for explicit archival replay, but are not repeated on every current
        # mainline change. Four reproduce already-frozen floating artifacts and
        # two fork retired training-line workers after NumPy initialization.
        run: >-
          OPENBLAS_CORETYPE=Haswell python -c
          'import os, numpy, pytest;
          os.environ.pop("OPENBLAS_CORETYPE", None);
          raise SystemExit(pytest.main([
          "-q",
          "--deselect=tests/test_information_theory_measurement_repair.py::test_development_selection_replays_without_formal_outcome_or_seed_reuse",
          "--deselect=tests/test_information_theory_measurement_repair.py::test_repair_completion_is_result_blind_and_emits_only_availability_fact",
          "--deselect=tests/test_m4_v2_branch_fixture_freeze.py::test_fixture_contract_regenerates_exact_orthogonal_truth",
          "--deselect=tests/test_research_os_mainline_supervisor.py::test_supervisor_projects_preflight_and_fail_closed_repair_branch_with_replay",
          "--deselect=tests/test_training_supervisor.py::test_prefilter_configs_target_parallel_matches_single_worker",
          "--deselect=tests/test_training_supervisor.py::test_evaluate_configs_target_parallel_matches_single_worker",
          ]))'
