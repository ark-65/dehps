name: Worker Python Tests

on:
  pull_request:
    paths:
      - "apps/worker-python/**"
      - ".github/workflows/worker-python-tests.yml"
      - ".github/scripts/run_worker_tests.py"
      - "docs/experiments/2026-08-11-m4-p3-predictive-route-reconciliation-and-p2r-p6-policy.md"
  push:
    branches: [main]
    paths:
      - "apps/worker-python/**"
      - ".github/workflows/worker-python-tests.yml"
      - ".github/scripts/run_worker_tests.py"
      - "docs/experiments/2026-08-11-m4-p3-predictive-route-reconciliation-and-p2r-p6-policy.md"

concurrency:
  group: worker-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEHPS_CI_SHARD_INDEX: ${{ matrix.shard }}
      # Frozen evidence digests include numerically solved float payloads.
      # Keep OpenBLAS on one portable AVX2 kernel so hosted-runner CPU model
      # changes cannot perturb the final few bits and make replay checks flaky.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: apps/worker-python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: apps/worker-python/pyproject.toml
      - name: Install worker
        run: python -m pip install -e . "numpy==2.4.6"
      - name: Run complete worker test partition
        run: OPENBLAS_CORETYPE=Haswell python ../../.github/scripts/run_worker_tests.py

  pytest:
    name: pytest
    if: always()
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - name: Require every partition to succeed
        env:
          WORKER_RESULT: ${{ needs.worker.result }}
        run: test "$WORKER_RESULT" = success
