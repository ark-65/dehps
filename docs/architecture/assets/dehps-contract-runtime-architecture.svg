<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
  <title id="title">DEHPS Contract Runtime Architecture</title>
  <desc id="desc">Contract compiler validates domain contracts and manifests, emits ABI packages through a verifier-gated cache, kernel planner dispatches to interchangeable backends, and artifact runtime persists runtime envelopes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .sectionLabel { font: 700 14px Arial, sans-serif; fill: #334155; letter-spacing: 0.4px; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 10; }
      .implemented { fill: #ecfdf5; stroke: #059669; }
      .planned { fill: #fff7ed; stroke: #ea580c; }
      .kernel { fill: #eef2ff; stroke: #4f46e5; }
      .artifact { fill: #fdf2f8; stroke: #db2777; }
      .text { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .softArrow { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
      .status { font: 700 11px Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1280" height="1000"/>
  <text class="title" x="50" y="54">DEHPS Contract Runtime Architecture</text>
  <text class="subtitle" x="50" y="82">Contracts define meaning. The compiler emits ABI. Kernels execute buffers. Artifacts carry runtime evidence.</text>

  <rect class="section" x="40" y="120" width="250" height="740"/>
  <text class="sectionLabel" x="62" y="150">DOMAIN AND CONTRACTS</text>

  <rect class="box implemented" x="70" y="180" width="190" height="66"/>
  <text class="text" x="92" y="207">History Snapshot</text>
  <text class="small" x="92" y="228">history_snapshot.v1.0.0</text>
  <text class="status" x="216" y="202">DONE</text>

  <rect class="box implemented" x="70" y="280" width="190" height="66"/>
  <text class="text" x="92" y="307">Window Contract</text>
  <text class="small" x="92" y="328">window.v1.0.0</text>
  <text class="status" x="216" y="302">DONE</text>

  <rect class="box implemented" x="70" y="380" width="190" height="66"/>
  <text class="text" x="92" y="407">Candidate Contract</text>
  <text class="small" x="92" y="428">identity semantics</text>
  <text class="status" x="216" y="402">DONE</text>

  <rect class="box implemented" x="70" y="480" width="190" height="66"/>
  <text class="text" x="92" y="507">Feature Contract</text>
  <text class="small" x="92" y="528">meaning and formulas</text>
  <text class="status" x="216" y="502">DONE</text>

  <rect class="box implemented" x="70" y="580" width="190" height="66"/>
  <text class="text" x="92" y="607">Scoring Contract</text>
  <text class="small" x="92" y="628">strict_v1</text>
  <text class="status" x="216" y="602">DONE</text>

  <rect class="box implemented" x="70" y="680" width="190" height="66"/>
  <text class="text" x="92" y="707">Ranking Contract</text>
  <text class="small" x="92" y="728">strict_v1 / legacy</text>
  <text class="status" x="216" y="702">DONE</text>

  <rect class="box implemented" x="70" y="780" width="190" height="66"/>
  <text class="text" x="92" y="807">Evaluation Contract</text>
  <text class="small" x="92" y="828">evaluation.v1.0.0</text>
  <text class="status" x="216" y="802">ART</text>

  <rect class="section" x="350" y="120" width="250" height="740"/>
  <text class="sectionLabel" x="372" y="150">CONTROL PLANE</text>

  <rect class="box" x="380" y="205" width="190" height="78"/>
  <text class="text" x="407" y="234">Contract Registry</text>
  <text class="small" x="407" y="256">versions, digests,</text>
  <text class="small" x="407" y="273">golden suites</text>

  <rect class="box" x="380" y="350" width="190" height="94"/>
  <text class="text" x="407" y="379">Contract Compiler</text>
  <text class="small" x="407" y="401">validates DAG</text>
  <text class="small" x="407" y="418">projects manifests</text>
  <text class="small" x="407" y="435">emits ABI package</text>

  <rect class="box" x="380" y="535" width="190" height="90"/>
  <text class="text" x="407" y="564">Compatibility</text>
  <text class="text" x="407" y="584">Matrix</text>
  <text class="small" x="407" y="606">missing edge rejects</text>

  <rect class="section" x="660" y="120" width="250" height="740"/>
  <text class="sectionLabel" x="682" y="150">ABI PACKAGE</text>

  <rect class="box planned" x="690" y="185" width="190" height="76"/>
  <text class="text" x="724" y="214">ABI Header</text>
  <text class="small" x="724" y="236">version, layout digest</text>

  <rect class="box implemented" x="690" y="285" width="190" height="76"/>
  <text class="text" x="724" y="314">Window ABI</text>
  <text class="small" x="724" y="336">stage envelope</text>

  <rect class="box implemented" x="690" y="385" width="190" height="76"/>
  <text class="text" x="724" y="414">Candidate ABI</text>
  <text class="small" x="724" y="436">lex id, masks, rank</text>

  <rect class="box implemented" x="690" y="485" width="190" height="76"/>
  <text class="text" x="724" y="514">Feature ABI</text>
  <text class="small" x="724" y="536">index, dtype, shape</text>

  <rect class="box implemented" x="690" y="585" width="190" height="76"/>
  <text class="text" x="724" y="614">Buffers</text>
  <text class="small" x="724" y="636">payload refs, digests</text>

  <rect class="box implemented" x="690" y="700" width="190" height="76"/>
  <text class="text" x="724" y="729">Runtime ABI Cache</text>
  <text class="small" x="724" y="751">bounded, reverified hits</text>

  <rect class="section" x="970" y="120" width="250" height="740"/>
  <text class="sectionLabel" x="992" y="150">EXECUTION AND EVIDENCE</text>

  <rect class="box kernel" x="1000" y="190" width="190" height="94"/>
  <text class="text" x="1032" y="219">Kernel Planner</text>
  <text class="small" x="1032" y="241">numpy reference</text>
  <text class="small" x="1032" y="258">numba cpu</text>
  <text class="small" x="1032" y="275">future SIMD / GPU</text>

  <rect class="box kernel" x="1000" y="340" width="190" height="76"/>
  <text class="text" x="1032" y="369">Compute Kernel</text>
  <text class="small" x="1032" y="391">buffers only</text>

  <rect class="box artifact" x="1000" y="480" width="190" height="76"/>
  <text class="text" x="1032" y="509">Ranking Runtime</text>
  <text class="small" x="1032" y="531">strict identity</text>

  <rect class="box artifact" x="1000" y="620" width="190" height="76"/>
  <text class="text" x="1032" y="649">Artifact Runtime</text>
  <text class="small" x="1032" y="671">runtime envelope</text>

  <path class="arrow" d="M 165 246 L 165 280"/>
  <path class="arrow" d="M 165 346 L 165 380"/>
  <path class="arrow" d="M 165 446 L 165 480"/>
  <path class="arrow" d="M 165 546 L 165 580"/>
  <path class="arrow" d="M 165 646 L 165 680"/>
  <path class="arrow" d="M 165 746 L 165 780"/>

  <path class="arrow" d="M 260 413 C 305 413 325 397 380 397"/>
  <path class="arrow" d="M 260 513 C 305 513 325 397 380 397"/>
  <path class="arrow" d="M 260 613 C 318 613 330 397 380 397"/>
  <path class="arrow" d="M 260 713 C 330 713 335 397 380 397"/>
  <path class="arrow" d="M 260 813 C 650 813 850 696 1000 658"/>
  <path class="arrow" d="M 260 213 C 305 213 325 244 380 244"/>
  <path class="arrow" d="M 260 313 C 310 313 325 244 380 244"/>

  <path class="arrow" d="M 570 397 L 690 223"/>
  <path class="arrow" d="M 570 397 L 690 323"/>
  <path class="arrow" d="M 570 397 L 690 423"/>
  <path class="arrow" d="M 570 397 L 690 523"/>
  <path class="arrow" d="M 570 397 L 690 623"/>
  <path class="softArrow" d="M 570 580 C 620 580 625 223 690 223"/>

  <path class="arrow" d="M 880 223 C 930 223 950 237 1000 237"/>
  <path class="arrow" d="M 880 323 C 930 323 950 237 1000 237"/>
  <path class="arrow" d="M 880 423 C 930 423 950 237 1000 237"/>
  <path class="arrow" d="M 880 523 C 930 523 950 237 1000 237"/>
  <path class="arrow" d="M 880 623 C 930 623 950 237 1000 237"/>
  <path class="softArrow" d="M 785 661 L 785 700"/>
  <path class="arrow" d="M 880 738 C 950 738 950 275 1000 260"/>

  <path class="arrow" d="M 1095 284 L 1095 340"/>
  <path class="arrow" d="M 1095 416 L 1095 480"/>
  <path class="arrow" d="M 1095 556 L 1095 620"/>

  <text class="small" x="51" y="920">Invariant: kernels consume ABI headers, buffers, and digests only. They do not parse contracts, manifests, SQL rows, feature formulas, or domain rules.</text>
  <text class="small" x="51" y="946">Candidate and Feature ABI execute through the Unified Verifier; forward Evaluation Artifact integration is verified. GPU/SIMD remain later.</text>
</svg>
