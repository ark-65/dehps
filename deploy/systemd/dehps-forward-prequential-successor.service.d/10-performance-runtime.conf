[Unit]
Requires=dehps-p3-performance-watchdog.service
After=dehps-p3-performance-watchdog.service

[Service]
# DEHPS_P3_INNER_THREADS=1
Environment=OMP_NUM_THREADS=1
Environment=OPENBLAS_NUM_THREADS=1
Environment=MKL_NUM_THREADS=1
Environment=NUMEXPR_NUM_THREADS=1
# DEHPS_P3_CPU_AFFINITY=0-21
CPUAffinity=0-21
ExecStartPre=/home/ark/workspace/dehps/apps/worker-python/.venv/bin/python /home/ark/workspace/dehps/apps/worker-python/scripts/run_m4_p3_performance_runtime.py enter --apply
ExecStopPost=/home/ark/workspace/dehps/apps/worker-python/.venv/bin/python /home/ark/workspace/dehps/apps/worker-python/scripts/run_m4_p3_performance_runtime.py exit --apply
