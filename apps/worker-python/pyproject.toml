[project]
name = "ark-dehps-worker"
version = "0.1.0"
description = "Python worker for DEHPS combination scoring and backtesting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "numba>=0.66",
  "orjson==3.11.9",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "scikit-learn==1.9.0",
  "typer>=0.12",
  "rich>=13.7",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "pytest>=8.2",
]

[project.optional-dependencies]
opencl = [
  "pyopencl>=2026.1.2,<2027",
]

[project.scripts]
dehps = "dehps.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
